name: meo-research

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "詳細収集の並列数"
        default: "4"
      limit:
        description: "1シャードあたりの店数上限（空=全部）"
        default: ""
      study:
        description: "空=通常／new=開業直後（口コミ40件以下の店を再取得して『最近オープン』表示を拾う。出力 detail_new_*）"
        default: ""

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: 母集団（残りの検索）
        env:
          FRAME_SUFFIX: ""
        run: python frame.py
      - name: 保存
        run: |
          git config user.name "meo-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/frame*.jsonl data/frame*_done.json
          git commit -m "frame: 検索の保存（study=${{ github.event.inputs.study }}）" || echo "no change"
          git pull --rebase && git push
      - uses: actions/upload-artifact@v4
        with: { name: frame, path: data/frame*.jsonl }

  detail:
    needs: frame
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: 店ごとの詳細（シャード ${{ matrix.shard }}）
        env:
          DETAIL_OUT: ${{ github.event.inputs.study == 'new' && 'detail_new_' || 'detail_' }}${{ matrix.shard }}.jsonl
          DETAIL_REDO: ${{ github.event.inputs.study == 'new' && '1' || '' }}
          DETAIL_MAX_REVIEWS: ${{ github.event.inputs.study == 'new' && '40' || '0' }}
        run: |
          LIM="${{ github.event.inputs.limit }}"
          python detail.py --workers 3 --shard ${{ matrix.shard }}/${{ github.event.inputs.shards }} ${LIM:+--limit $LIM}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail_${{ matrix.shard }}
          path: data/detail*_${{ matrix.shard }}.jsonl

  merge:
    needs: detail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull
      - uses: actions/download-artifact@v4
        with: { pattern: detail_*, path: data, merge-multiple: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 集計
        run: python analyze.py > data/result_latest.md
      - name: 保存
        run: |
          git config user.name "meo-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/detail*.jsonl data/result_latest.md
          git commit -m "detail: $(cat data/detail_*.jsonl | wc -l) 店／集計更新" || echo "no change"
          git pull --rebase && git push
